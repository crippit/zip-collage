      ),
      EyeOff: ({ className = "w-4 h-4", ...props }) => (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />

    function App() {
      const [images, setImages] = useState([]); // Array of { id, url, name }
      const [gridCols, setGridCols] = useState(10); // 5 to 25
      const [gridRows, setGridRows] = useState(10); // 5 to 25
      const [keepLinked, setKeepLinked] = useState(true); // Maintain Cols = Rows
      const [gap, setGap] = useState(2); // Pixel gap between grid cells (0 to 20)
      const [backgroundColor, setBackgroundColor] = useState('#ffffff');
      const [borderRadius, setBorderRadius] = useState(0); // px
      const [objectFit, setObjectFit] = useState('cover'); // 'cover' | 'contain'
      const [aspectRatioPreset, setAspectRatioPreset] = useState('square'); // 'square' | 'story' | 'widescreen'
      const [useMargins, setUseMargins] = useState(true); // Toggle outer safety margins
      const [blurAmount, setBlurAmount] = useState(0); // px blur filter (0 to 40)
      
      const [currentPage, setCurrentPage] = useState(0);
      const [draggedIndex, setDraggedIndex] = useState(null);
      const [selectedCell, setSelectedCell] = useState(null); // For mobile/click-to-swap
      const [isProcessing, setIsProcessing] = useState(false);
      const [notification, setNotification] = useState(null);

      const fileInputRef = useRef(null);
      const canvasRef = useRef(null);

      // Derived Values
      const itemsPerPage = gridCols * gridRows;
      const totalPages = Math.max(1, Math.ceil(images.length / itemsPerPage));

      // Link controls effect
      useEffect(() => {
        if (keepLinked && gridCols !== gridRows) {
          setGridRows(gridCols);
        }
      }, [gridCols, keepLinked]);

      // Reset page index if pages shrink
      useEffect(() => {
        if (currentPage >= totalPages) {
          setCurrentPage(Math.max(0, totalPages - 1));
        }
      }, [images.length, itemsPerPage, totalPages, currentPage]);

      // Show a temporary notification toast
      const showToast = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => {
          setNotification(null);
        }, 3000);
      };

      // Check if file is HEIC/HEIF
      const isHeic = (file) => {
        const name = file.name ? file.name.toLowerCase() : '';
        return (
          name.endsWith('.heic') || 
          name.endsWith('.heif') || 
          file.type === 'image/heic' || 
          file.type === 'image/heif'
        );
      };

      // Dynamically load heic2any script from CDN
      const loadHeicScript = () => {
        return new Promise((resolve, reject) => {
          if (window.heic2any) {
            resolve();
            return;
          }
          const script = document.createElement('script');
          script.src = "https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js";
          script.async = true;
          script.onload = () => resolve();
          script.onerror = () => reject(new Error("Failed to load HEIC converter library."));
          document.head.appendChild(script);
        });
      };

      // Convert HEIC file to JPEG
      const convertHeic = async (file) => {
        await loadHeicScript();
        if (!window.heic2any) {
          throw new Error("Converter library is not ready.");
        }
        const convertedBlob = await window.heic2any({
          blob: file,
          toType: "image/jpeg",
          quality: 0.8
        });
        const blob = Array.isArray(convertedBlob) ? convertedBlob[0] : convertedBlob;
        return new File([blob], file.name.replace(/\.(heic|heif)$/i, '.jpg'), { type: 'image/jpeg' });
      };

      // Handle file uploads asynchronously to accommodate conversion
      const handleFileUpload = async (e) => {
        const files = Array.from(e.target.files || []);
        if (files.length === 0) return;

        setIsProcessing(true);
        showToast('Processing uploaded photos...', 'info');

        const newImages = [];
        let convertedCount = 0;

        try {
          for (let file of files) {
            let fileToProcess = file;

            // Auto-detect and convert HEIC
            if (isHeic(file)) {
              showToast(`Converting HEIC file "${file.name}" in browser...`, 'info');
              try {
                fileToProcess = await convertHeic(file);
                convertedCount++;
              } catch (err) {
                console.error("HEIC conversion failed for:", file.name, err);
                showToast(`Skipped ${file.name} - converter error.`, 'error');
                continue;
              }
            }

            // Convert the image file to a Base64 data URL
            const dataUrl = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = (event) => resolve(event.target.result);
              reader.onerror = (err) => reject(err);
              reader.readAsDataURL(fileToProcess);
            });

            newImages.push({
              id: `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
              url: dataUrl,
              name: fileToProcess.name
            });
          }

          if (newImages.length > 0) {
            setImages((prev) => [...prev, ...newImages]);
            const msg = convertedCount > 0 
              ? `Successfully loaded ${newImages.length} images (converted ${convertedCount} HEIC files)!` 
              : `Successfully loaded ${newImages.length} images!`;
            showToast(msg, 'success');
          }
        } catch (err) {
          console.error(err);
          showToast('Error uploading files.', 'error');
        } finally {
          setIsProcessing(false);
        }
      };

      // Clear all images
      const handleClearAll = () => {
        setImages([]);
        setCurrentPage(0);
        setSelectedCell(null);
        showToast('Cleared all images', 'info');
      };

      // Shuffle images globally
      const handleShuffle = () => {
        if (images.length === 0) return;
        const shuffled = [...images].sort(() => Math.random() - 0.5);
        setImages(shuffled);
        showToast('Images shuffled!');
      };

      // Remove a specific image
      const handleRemoveImage = (globalIndex) => {
        const updated = [...images];
        updated.splice(globalIndex, 1);
        setImages(updated);
        setSelectedCell(null);
      };

      // Drag and Drop events (Desktop)
      const handleDragStart = (e, index) => {
        setDraggedIndex(index);
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = (e, targetIndex) => {
        e.preventDefault();
        if (draggedIndex === null || draggedIndex === targetIndex) return;

        swapImages(draggedIndex, targetIndex);
        setDraggedIndex(null);
      };

      // Swap logic helper
      const swapImages = (idxA, idxB) => {
        const updated = [...images];
        
        // Boundary check: If the destination index is empty (out of bounds)
        if (idxA >= updated.length || idxB >= updated.length) {
          const targetIndex = Math.min(Math.max(0, updated.length - 1), Math.max(idxA, idxB));
          const [movedItem] = updated.splice(idxA, 1);
          updated.splice(targetIndex, 0, movedItem);
          setImages(updated);
          showToast('Image moved within layout');
          return;
        }

        const temp = updated[idxA];
        updated[idxA] = updated[idxB];
        updated[idxB] = temp;
        setImages(updated);
        showToast('Positions swapped!');
      };

      // Click-to-swap logic (Mobile friendly)
      const handleCellClick = (localIndex) => {
        const globalIndex = currentPage * itemsPerPage + localIndex;
        if (globalIndex >= images.length) return; // Empty cell

        if (selectedCell === null) {
          setSelectedCell(globalIndex);
          showToast('Select another image to swap positions');
        } else {
          if (selectedCell !== globalIndex) {
            swapImages(selectedCell, globalIndex);
          }
          setSelectedCell(null);
        }
      };

      // Get current page's slice of images
      const getPageImages = () => {
        const start = currentPage * itemsPerPage;
        return images.slice(start, start + itemsPerPage);
      };

      // Render high-res custom canvas & trigger download
      const downloadCanvasPage = (pageIdx) => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        
        // Establish output dimensions based on user's active preset
        let width = 1080;
        let height = 1080;
        
        if (aspectRatioPreset === 'story') {
          width = 1080;
          height = 1920;
        } else if (aspectRatioPreset === 'widescreen') {
          width = 1920;
          height = 1080;
        }

        canvas.width = width;
        canvas.height = height;

        // Fill background
        ctx.fillStyle = backgroundColor;
        ctx.fillRect(0, 0, width, height);

        // Apply structured margin framework (4% safe-margin or 0% for full bleed)
        const marginX = useMargins ? width * 0.04 : 0;
        const marginY = useMargins ? height * 0.04 : 0;
        const availableWidth = width - marginX * 2;
        const availableHeight = height - marginY * 2;

        const totalGapsX = gridCols - 1;
        const totalGapsY = gridRows - 1;

        // Calculate maximum possible square cell size to fit nicely
        const maxCellWidth = (availableWidth - (totalGapsX * gap)) / gridCols;
        const maxCellHeight = (availableHeight - (totalGapsY * gap)) / gridRows;
        const cellSize = Math.min(maxCellWidth, maxCellHeight);

        // Centering offsets
        const gridWidth = gridCols * cellSize + totalGapsX * gap;
        const gridHeight = gridRows * cellSize + totalGapsY * gap;
        const startX = marginX + (availableWidth - gridWidth) / 2;
        const startY = marginY + (availableHeight - gridHeight) / 2;

        const startIdx = pageIdx * itemsPerPage;
        const pageSlice = images.slice(startIdx, startIdx + itemsPerPage);

        let loadedImagesCount = 0;
        const imagesToLoad = pageSlice.length;

        if (imagesToLoad === 0) {
          showToast('No images to draw on this page!', 'error');
          return;
        }

        setIsProcessing(true);

        pageSlice.forEach((imgData, index) => {
          const col = index % gridCols;
          const row = Math.floor(index / gridCols);

          const x = startX + col * (cellSize + gap);
          const y = startY + row * (cellSize + gap);

          if (!imgData || !imgData.url) {
            ctx.fillStyle = backgroundColor;
            ctx.fillRect(x, y, cellSize, cellSize);
            incrementLoadedCount();
            return;
          }

          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.src = imgData.url;

          img.onload = () => {
            ctx.save();
            
            // Always clip to cell bounds to prevent bleed, apply radius if needed
            ctx.beginPath();
            if (borderRadius > 0 && typeof ctx.roundRect === 'function') {
              ctx.roundRect(x, y, cellSize, cellSize, borderRadius);
            } else {
              ctx.rect(x, y, cellSize, cellSize);
            }
            ctx.clip();

            // Draw square cell handling 'cover' or 'contain'
            const imgRatio = img.width / img.height;
            const cellRatio = 1.0;
            
            let drawWidth, drawHeight, offsetX, offsetY;

            if (objectFit === 'cover') {
              if (imgRatio > cellRatio) {
                drawHeight = cellSize;
                drawWidth = cellSize * imgRatio;
                offsetX = x - (drawWidth - cellSize) / 2;
                offsetY = y;
              } else {
                drawWidth = cellSize;
                drawHeight = cellSize / imgRatio;
                offsetX = x;
                offsetY = y - (drawHeight - cellSize) / 2;
              }
            } else { // 'contain'
              if (imgRatio > cellRatio) {
                drawWidth = cellSize;
                drawHeight = cellSize / imgRatio;
                offsetX = x;
                offsetY = y + (cellSize - drawHeight) / 2;
              } else {
                drawHeight = cellSize;
                drawWidth = cellSize * imgRatio;
                offsetX = x + (cellSize - drawWidth) / 2;
                offsetY = y;
              }
              // Pre-fill background cell for contain
              ctx.fillStyle = backgroundColor;
              ctx.fillRect(x, y, cellSize, cellSize);
            }

            // Apply Overall Blur Filter on the offline canvas during drawing
            if (blurAmount > 0) {
              ctx.filter = `blur(${blurAmount}px)`;
            }

            ctx.drawImage(img, offsetX, offsetY, drawWidth, drawHeight);
            ctx.restore();

            incrementLoadedCount();
          };

          img.onerror = () => {
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(x, y, cellSize, cellSize);
            incrementLoadedCount();
          };
        });

        function incrementLoadedCount() {
          loadedImagesCount++;
          if (loadedImagesCount === imagesToLoad) {
            try {
              const dataUrl = canvas.toDataURL('image/png');
              const link = document.createElement('a');
              link.download = `collage-grid-page-${pageIdx + 1}-${aspectRatioPreset}-${gridCols}x${gridRows}.png`;
